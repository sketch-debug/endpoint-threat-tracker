name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies (runtime + gate tools)
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # The three CI gates from the audit: lint with pinned rules, zero
      # known CVEs in the runtime pins, and a coverage floor so a change
      # that quietly stops being tested cannot merge green.
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Audit dependencies (pip-audit)
        run: python -m pip_audit -r requirements.txt
      - name: Run test suite with coverage gate
        run: python -m pytest --cov=app --cov-report=term --cov-fail-under=70

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the one-command installer
        shell: cmd
        run: .\install.bat -NoStart
      - name: Start the dashboard and check HTTP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString() |
            Set-Content -Path data/last_feed_update.txt -NoNewline

          $python = Join-Path $PWD '.venv\Scripts\python.exe'
          $out = Join-Path $PWD 'ci-server.out.log'
          $err = Join-Path $PWD 'ci-server.err.log'
          $proc = Start-Process -FilePath $python -ArgumentList '-m', 'app.main' `
            -WorkingDirectory "$PWD" -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err

          try {
            $loginCode = ''
            for ($i = 0; $i -lt 60; $i++) {
              $loginCode = & curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8043/login
              if ($loginCode -eq '200') { break }
              Start-Sleep -Seconds 1
            }
            if ($loginCode -ne '200') {
              Get-Content $out -ErrorAction SilentlyContinue
              Get-Content $err -ErrorAction SilentlyContinue
              throw "Dashboard did not answer on /login (last status: $loginCode)"
            }

            $rootCode = & curl.exe -s -o NUL -w "%{http_code}" http://127.0.0.1:8043/
            if ($rootCode -ne '303') {
              throw "Expected GET / to redirect to /login with 303, got $rootCode"
            }
            Write-Host "Dashboard responded: /login=$loginCode /=$rootCode"
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      # The documented journey (README quick start, FIRST_DAY_RUNBOOK) is
      # install -> smoke_test.bat -> dashboard, and CI used to stop at an HTTP
      # probe: nothing executed the 11 steps, so a regression in ingest,
      # detection, the report page or the login handoff could merge green.
      # The step above already wrote data/last_feed_update.txt (so the app
      # under test does not fetch feeds) and stopped its own instance, leaving
      # port 8043 free for the instance the smoke test starts.
      - name: Run the smoke test end to end
        shell: cmd
        run: .\smoke_test.bat

  installer-offline:
    runs-on: windows-latest
    # Most steps use shell: powershell (5.1). The final step deliberately runs
    # under pwsh: install.bat launches powershell.exe, and a pwsh prompt hands
    # that child a PowerShell 7 PSModulePath under which 5.1 cannot resolve
    # Microsoft.PowerShell.Utility (Get-FileHash). install.bat must sanitize
    # PSModulePath itself - the final step fails if that fix regresses.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare the virtual environment
        shell: powershell
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw 'Creating .venv failed.' }
          exit 0
      - name: Offline install must refuse a missing packages directory
        shell: powershell
        run: |
          & .\install.bat -Offline *> guard.log
          $code = $LASTEXITCODE
          $out = Get-Content -LiteralPath guard.log -Raw
          Write-Host $out
          if ($code -eq 0) {
            throw 'install.bat -Offline succeeded even though packages\ is absent.'
          }
          if (-not $out.Contains('packages\ is missing or empty')) {
            throw "install.bat -Offline failed for another reason (exit $code); see guard.log."
          }
          Write-Host 'Offline install correctly refused the missing packages directory.'
          exit 0
      - name: Build the offline packages directory
        shell: powershell
        run: |
          $venvPy = Join-Path $PWD '.venv\Scripts\python.exe'
          & .\scripts\Build-OfflinePackages.ps1 -Python $venvPy
          $files = @(Get-ChildItem -LiteralPath packages -File)
          if ($files.Count -eq 0) {
            throw 'Build-OfflinePackages.ps1 produced no files in packages\.'
          }
          $notWheels = @($files | Where-Object Extension -NE '.whl')
          if ($notWheels.Count -gt 0) {
            throw "packages\ must hold wheels only, found: $($notWheels.Name -join ', ')"
          }
          Write-Host "packages\ holds $($files.Count) wheels."
          exit 0
      - name: Install offline against the prebuilt packages
        shell: powershell
        run: |
          # A dead index: if anything reaches for PyPI the step fails, so a green
          # run proves pip resolved every dependency from packages\ alone.
          $env:PIP_INDEX_URL = 'http://127.0.0.1:9/simple'
          & .\install.bat -Offline -NoStart *> offline.log
          $code = $LASTEXITCODE
          $out = Get-Content -LiteralPath offline.log -Raw
          Write-Host $out
          if ($code -ne 0) {
            throw "install.bat -Offline -NoStart failed (exit $code); see offline.log."
          }
          if (-not $out.Contains('Installing from packages\')) {
            throw 'The installer did not install from packages\; see offline.log.'
          }
          if (-not $out.Contains('Setup complete.')) {
            throw 'The installer did not print "Setup complete."; see offline.log.'
          }
          exit 0
      - name: Offline install also works from a PowerShell 7 prompt
        shell: pwsh
        run: |
          # Regression: run install.bat exactly as an admin at a pwsh prompt would.
          # Before install.bat cleared the inherited PSModulePath, install.ps1 died
          # here with "Get-FileHash is not recognized" (exit non-zero).
          Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue
          # Deleting the venv also hands the interpreter choice back to
          # install.ps1: the py launcher's default here is NEWER than the wheels
          # in packages\ (the Prepare/Build steps made them with setup-python's
          # 3.13), so this step only passes if the installer itself picks the
          # interpreter the wheels were built for.
          $env:PIP_INDEX_URL = 'http://127.0.0.1:9/simple'
          & .\install.bat -Offline -NoStart *> pwsh.log
          $code = $LASTEXITCODE
          $out = Get-Content -LiteralPath pwsh.log -Raw
          Write-Host $out
          if ($code -ne 0) {
            throw "install.bat failed when launched from a pwsh prompt (exit $code); see pwsh.log."
          }
          if (-not $out.Contains('Setup complete.')) {
            throw 'install.bat from pwsh did not print "Setup complete."; see pwsh.log.'
          }
          Write-Host 'install.bat completed from a PowerShell 7 prompt.'
          exit 0
