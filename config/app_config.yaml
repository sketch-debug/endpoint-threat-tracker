paths:
  inbox_dir: inbox
  processed_dir: inbox/processed
  error_dir: inbox/errors
  db_path: data/tracker.db
  reports_dir: reports
  log_dir: logs
server:
  host: 127.0.0.1
  port: 8043
ingest:
  poll_seconds: 30
  max_file_bytes: 52428800
  stability_seconds: 5
  allowed_extensions:
  - .csv
  - .json
  - .jsonl
  - .txt
  - .log
ip_map_file: config/ip_map.txt
technitium_columns:
  timestamp:
  - Time
  - Timestamp
  - DateTime
  client:
  - Client
  - Client IP
  - Query Iteration Client Address
  domain:
  - Domain
  - Query
  - Question
  - Name
scoring_window_hours: 24
off_hours:
- 22:00-06:00
alerts:
  enabled: true
  channels:
  - log
  min_interval_minutes: 0
recheck:
  days: 14
retention:
  enabled: true
  observations_days: 90
  signals_days: 90
  audit_days: 180
  alerts_days: 365
  files_days: 90
  batch_size: 5000
health:
  heartbeat_hours: 6
  indicator_max_age_days: 14
