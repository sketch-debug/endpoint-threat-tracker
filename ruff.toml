# Pinned in-repo so every runner (local, CI) lints with the same rules:
# without this file ruff picks up config from outside the repo and the gate
# silently differs between machines.
target-version = "py313"
line-length = 88

[lint]
# Ruff's default rule set: pycodestyle errors (E4/E7/E9) + pyflakes (F).
select = ["E4", "E7", "E9", "F"]
